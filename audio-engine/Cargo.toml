[package]
name = "parent-architect-audio"
version = "0.1.0"
authors = ["Parent Architect Team"]
edition = "2021"
description = "Professional audio synthesis engine for Parent Architect slow wake timer"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
# Core WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"

# Web Audio API bindings
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioNode",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "GainNode",
    "OscillatorNode",
    "BiquadFilterNode",
    "console",
] }

# Audio DSP libraries
# dasp = "0.11"  # Uncomment when implementing DSP
# fundsp = "0.10"  # Uncomment for synthesis utilities

# Serialization for presets
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# Random number generation
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Optimize for size
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
# Fast compilation for development
opt-level = 0
debug = true
