name: patient_parenting_sleep
description: Science-based sleep sounds and gentle wake alarm system
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Audio & Background
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  flutter_volume_controller: ^1.3.1

  # Alarm & Background Tasks
  android_alarm_manager_plus: ^3.0.4
  flutter_local_notifications: ^16.3.0

  # System Control
  screen_brightness: ^0.2.2+1
  vibration: ^1.8.4
  wakelock_plus: ^1.1.4

  # Rust Bridge
  flutter_rust_bridge: ^2.0.0
  ffi: ^2.1.0

  # State Management & Storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # UI
  cupertino_icons: ^1.0.6
  flutter_slidable: ^3.0.1
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  ffigen: ^11.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/birds/
    - assets/classical/
